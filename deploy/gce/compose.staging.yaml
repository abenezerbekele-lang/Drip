name: drip-staging

services:
  api:
    build:
      context: ../../server
      dockerfile: Dockerfile
    image: drip-api:staging
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    env_file:
      - /etc/drip/staging.env
    environment:
      NODE_ENV: production
      DEPLOYMENT_STAGE: staging
      HOST: 0.0.0.0
      PORT: 4242
      DATABASE_PATH: /var/lib/drip/drip.sqlite
    volumes:
      - type: bind
        source: /var/lib/drip
        target: /var/lib/drip
    ports:
      - "127.0.0.1:4242:4242"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
